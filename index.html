<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>小朋友下樓梯 3D：深淵大亂鬥｜單人極速＆多人連線派對</title>
  <link rel="stylesheet" href="./styles.css?v=20261114_4" />
  <!-- PeerJS for Serverless WebRTC P2P Multiplayer on GitHub Pages -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Three.js via jsDelivr CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Toast Notification -->
  <div id="global-toast" class="global-toast hidden">✅ 已複製專屬房間連結！傳給朋友點開即可直接進房！</div>

  <!-- ================= LOBBY & CUSTOMIZATION SCREEN ================= -->
  <div id="lobby-screen" class="screen active">
    <header class="lobby-header">
      <div class="brand-badge">
        <span class="brand-icon">🪜</span>
        <div>
          <h1>小朋友下樓梯 3D <span class="accent">深淵大亂鬥</span></h1>
          <p class="subtitle">極速百層挑戰 × 精緻紙娃娃 × 踩頭推人 × 背後靈復仇</p>
        </div>
      </div>
      <div class="header-right-group">
        <button id="btn-sound-toggle" class="icon-pill-btn" title="音效開關">🔊</button>
        <div id="online-status" class="online-tag">🟢 單人/連線就緒</div>
        <button id="btn-top-share" class="mini-share-btn">🔗 邀朋友</button>
      </div>
    </header>

    <!-- Unobstructed 3D Character Showcase Window (Top Half - Never Blocked by UI!) -->
    <div id="preview-touch-zone" class="preview-stage">
      <div class="stage-top-bar">
        <span id="stage-name-preview" class="stage-name-tag">👑 下樓梯小霸王</span>
        <span class="stage-rotate-hint">👆 左右滑動旋轉角色</span>
      </div>

      <div class="stage-corner-actions">
        <button id="btn-random-all" class="random-dice-btn">🎲 隨機全身＋名</button>
        <button id="btn-random-outfit" class="random-dice-btn secondary">✨ 隨機穿搭</button>
      </div>
    </div>

    <!-- Bottom Compact Tabbed Sheet (Strictly Below Character Stage) -->
    <section class="lobby-sheet">
      <!-- Tab Switcher + Solo Bot Toggle -->
      <div class="sheet-top-bar">
        <div class="lobby-tabs">
          <button class="lobby-tab active" data-tab="tab-avatar">🎭 角色造型設定</button>
          <button class="lobby-tab" data-tab="tab-room">
            🏠 好友連線房 <span id="tab-player-badge" class="tab-badge">1人</span>
          </button>
        </div>
        <label class="compact-bot-toggle" title="開啟後會有5位搞笑穿搭AI一起亂鬥；關閉則為純個人百層極限挑戰">
          <input type="checkbox" id="chk-fill-bots" checked />
          <span>🤖 AI亂鬥陪玩</span>
        </label>
      </div>

      <!-- TAB 1: CHARACTER CUSTOMIZATION -->
      <div id="tab-avatar" class="tab-panel active">
        <div class="customizer-scroll">
          <!-- Name Row -->
          <div class="cust-row name-row">
            <label class="cust-label">🏷️ 角色名字</label>
            <div class="name-input-wrap">
              <input id="player-name" type="text" value="下樓梯小霸王" maxlength="10" placeholder="輸入角色名字" />
              <button id="btn-random-name" class="dice-icon-btn" title="隨機搞笑名字">🎲</button>
            </div>
          </div>

          <!-- Gender & Hair Color Row -->
          <div class="cust-row split-two-col">
            <div>
              <label class="cust-label">⚧️ 性別氣質</label>
              <div id="opt-gender" class="pill-group"></div>
            </div>
            <div>
              <label class="cust-label">🎨 髮色</label>
              <div id="opt-hair-color" class="color-swatch-row"></div>
            </div>
          </div>

          <!-- Hair Style Row -->
          <div class="cust-row">
            <label class="cust-label">💇 髮型與頭飾</label>
            <div id="opt-hair" class="pill-group"></div>
          </div>

          <!-- Top Row -->
          <div class="cust-row">
            <label class="cust-label">👕 上衣 <small id="top-override-hint" class="override-hint"></small></label>
            <div id="opt-top" class="pill-group"></div>
          </div>

          <!-- Bottom Row -->
          <div class="cust-row">
            <label class="cust-label">👖 下身 <small id="bottom-override-hint" class="override-hint"></small></label>
            <div id="opt-bottom" class="pill-group"></div>
          </div>

          <!-- Full Suit Row -->
          <div class="cust-row">
            <label class="cust-label">🦸 特殊套裝 <small>(一鍵全身變裝)</small></label>
            <div id="opt-suit" class="pill-group"></div>
          </div>
        </div>
      </div>

      <!-- TAB 2: MULTIPLAYER ROOM & ROSTER -->
      <div id="tab-room" class="tab-panel">
        <div class="room-setup-grid">
          <div class="field-box">
            <label>🏠 房號代碼</label>
            <input id="room-input" type="text" value="B100" maxlength="8" placeholder="例如 B100" />
          </div>

          <div class="field-box">
            <label>🔒 房間密碼 <small>(選填)</small></label>
            <input id="room-pwd-input" type="text" value="" maxlength="8" placeholder="可不填" />
          </div>

          <div class="room-btn-group">
            <button id="btn-join-room" class="action-pill-btn join-btn">🔑 建立/進房</button>
            <button id="btn-share-link" class="action-pill-btn share-btn">🔗 複製邀請連結</button>
          </div>
        </div>

        <div class="room-roster-wrap">
          <div class="roster-box">
            <div class="section-title">
              <span>👥 房間等待名單</span>
              <span id="ready-counter" class="ready-count-badge">準備 1/1</span>
            </div>
            <div id="roster-list" class="roster-list"></div>
          </div>
        </div>
      </div>

      <!-- Pinned CTA Row: Instant 1P Solo, 1P+AI Party, and Room Start -->
      <div class="lobby-cta-row">
        <button id="btn-solo-pure" class="start-game-btn solo-pure-btn" type="button">
          ⚡ 單人挑戰(1人)
        </button>
        <button id="btn-solo-start" class="start-game-btn solo-instant-btn" type="button">
          🤖 單人+AI亂鬥
        </button>
        <button id="btn-guest-ready" class="start-game-btn ready-toggle-btn hidden" type="button">
          ✅ 準備完成
        </button>
        <button id="btn-host-start" class="start-game-btn room-start-btn" type="button">
          🚀 房間開局
        </button>
      </div>
    </section>
  </div>

  <!-- ================= IN-GAME HUD SCREEN ================= -->
  <div id="hud-screen" class="screen">
    <!-- Top Status Bar -->
    <div class="hud-top">
      <div class="hud-top-row">
        <!-- Floor Depth, Combo & Personal HP -->
        <div class="depth-hp-card">
          <div class="floor-row-inline">
            <div class="floor-badge" id="hud-floor">🌊 地下 B001 層</div>
            <span id="hud-combo-badge" class="combo-badge hidden">🔥 連下 x3</span>
          </div>
          <div class="hp-bar-wrap">
            <span class="hp-label" id="hud-hp-text">❤️ 12/12</span>
            <div id="hud-hp-segments" class="hp-segments"></div>
          </div>
        </div>

        <!-- Active Field Hazard / Ceiling Warning -->
        <div class="center-status-col">
          <div id="hud-ceiling-warn" class="ceiling-pill">⚙️ 尖刺逼近中</div>
          <div id="hud-field-event" class="field-event-pill hidden">⚡ 全場加速中</div>
        </div>

        <!-- Alive Count & Camera/Sound Toggle -->
        <div class="right-status-col">
          <span class="count-pill alive" id="hud-alive-count">👑 存活: 6</span>
          <div class="hud-mini-btns">
            <button id="btn-cam-mode" class="cam-toggle-btn" type="button">🎥 視角</button>
            <button id="btn-hud-restart" class="cam-toggle-btn restart-mini-btn" type="button" title="立即重開一局">🔄 重來</button>
          </div>
        </div>
      </div>

      <!-- Event Feed -->
      <div id="event-feed" class="event-feed"></div>
    </div>

    <!-- Center Announcement Banner -->
    <div id="center-banner" class="center-banner hidden"></div>

    <!-- Ghost Mode Status Banner + Instant Finish Button for Solo Players -->
    <div id="ghost-mode-banner" class="ghost-banner hidden">
      <span>👻 你已變成「背後靈」！用右下技能害人，或</span>
      <button id="btn-ghost-finish-now" class="ghost-finish-btn" type="button">🏁 立即結算重玩</button>
    </div>

    <!-- ================= BOTTOM MOBILE-OPTIMIZED TOUCH CONTROLS ================= -->
    <div class="hud-controls">
      <!-- Left Half: Dynamic Floating 360 Virtual Joystick -->
      <div id="joystick-zone" class="joystick-zone">
        <div id="joystick-base" class="joystick-base">
          <div class="joy-cross"></div>
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
        <div class="joystick-hint">👆 左下隨處滑動移動</div>
      </div>

      <!-- Right Half: Ergonomic Multi-Touch Action Buttons -->
      <div class="right-control-col">
        <!-- ALIVE PLAYER ACTIONS -->
        <div id="alive-actions" class="action-cluster">
          <!-- Item Slot Button -->
          <button id="btn-use-item" class="item-slot-btn empty" type="button" disabled>
            <span id="item-btn-icon" class="item-icon">🎁</span>
            <div class="item-txt">
              <strong id="item-btn-name">無道具</strong>
              <small id="item-btn-sub">踩問號箱拾取</small>
            </div>
          </button>

          <div class="primary-btn-row">
            <!-- Shove / Elbow Push Button -->
            <button id="btn-shove" class="round-act-btn shove-btn" type="button">
              <span class="act-emoji">🥊</span>
              <span class="act-label">推人</span>
              <small id="shove-cd-text">就緒</small>
            </button>

            <!-- Giant Jump / Head-Stomp Button -->
            <button id="btn-jump" class="round-act-btn jump-main-btn" type="button">
              <span class="act-emoji">⬆️</span>
              <span class="act-label">跳躍/踩頭</span>
            </button>
          </div>
        </div>

        <!-- GHOST REVENGE ACTIONS (Shown when eliminated) -->
        <div id="ghost-actions" class="action-cluster ghost-cluster hidden">
          <button id="btn-ghost-curse" class="ghost-skill-btn curse-btn" type="button">
            <span class="act-emoji">💥</span>
            <div>
              <strong>詛咒最近踏板</strong>
              <small id="curse-cd-text">變成尖刺/碎裂磚</small>
            </div>
          </button>

          <div class="primary-btn-row">
            <button id="btn-ghost-rock" class="round-act-btn rock-btn" type="button">
              <span class="act-emoji">☄️</span>
              <span class="act-label">召喚落石</span>
              <small id="rock-cd-text">就緒</small>
            </button>

            <button id="btn-ghost-dash" class="round-act-btn ghost-up-btn" type="button">
              <span class="act-emoji">👻</span>
              <span class="act-label">閃現追人</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= RESULT SCREEN ================= -->
  <div id="result-screen" class="screen">
    <div class="result-card">
      <div class="result-badge" id="result-trophy">🏆</div>
      <h2 id="result-title">大逃殺結束！深淵生還王誕生！</h2>
      <p id="result-subtitle" class="result-stats-line">最高紀錄：地下 B042 層</p>

      <div class="leaderboard-list" id="leaderboard-list"></div>

      <div class="result-actions">
        <button id="btn-play-again-instant" class="start-game-btn solo-instant-btn" type="button">⚡ 立即再戰一局</button>
        <button id="btn-back-lobby" class="start-game-btn secondary-lobby-btn" type="button">🎭 返回大廳換裝</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js?v=20261114_4"></script>
</body>
</html>
